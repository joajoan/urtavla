[project]
name = "urtavla"
version = "0.1.0"
description = "NumPy-based time feature extraction"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Johan Brandby", email = "j@brandby.se" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  {include-group = "lint"},
  {include-group = "test"},
]
lint = [
    "mdformat>=1.0.0",
    "ruff>=0.17.3",
    "ty>=0.0.97",
]
test = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
addopts = [
  "--doctest-modules",
  "--doctest-glob=README.md",
]
filterwarnings = [
  "error::DeprecationWarning",
]
