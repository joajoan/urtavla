[project]
name = "urtavla"
version = "0.1.0"
description = "NumPy-based time feature extraction"
authors = [
  { name = "Johan Brandby", email = "j@brandby.se" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  {include-group = "lint"},
]
lint = [
    "mdformat>=1.0.0",
    "ruff>=0.17.3",
    "ty>=0.0.97",
]
